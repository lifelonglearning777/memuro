<!doctype html>
<!-- ============================================================
  まちるだいすけと めむろたんけん (Phase 7・1ファイル完結版)
  この1ファイルに 見た目(CSS)・問題データ・ふりがな辞書・
  プログラムのすべてが入っています。写真は images フォルダ、
  オフライン対応は sw.js / manifest.webmanifest を使います。
  問題を直すときは「問題データ」の目印コメントを探してください。
  ============================================================ -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#71b957">
  <title>まちるだいすけと めむろたんけん</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
/* ============================================================
   まちるだいすけと めむろたんけん - 見た目の設定（CSS）
   ------------------------------------------------------------
   色を変えたいときは、下の :root の中の色コードを変えます。
   例) --grass: #70b957;  ← 草原の緑。#から始まる6桁が色の指定。
   ============================================================ */
:root {
  --grass: #70b957;
  --grass-dark: #367b3f;
  --cream: #fff8df;
  --sky: #8dd8ee;
  --corn: #ffd84d;
  --ink: #263d3b;
  --white: #fff;
  --red: #e96957;
  --shadow: 0 6px 0 rgba(39, 83, 61, .16);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(105deg, transparent 0 48%, rgba(107,172,78,.07) 48% 52%, transparent 52% 100%),
    linear-gradient(#dff6ff 0 34%, #f9f3d4 34% 100%);
  font-family: "Hiragino Maru Gothic ProN", "HG丸ｺﾞｼｯｸM-PRO", "UD Digi Kyokasho NK-R", Meiryo, sans-serif;
  font-size: 18px;
  font-weight: 700;
}

.sky {
  position: fixed;
  inset: 56px 0 auto;
  height: 150px;
  z-index: -1;
  opacity: .16;
  background: linear-gradient(145deg, transparent 0 43%, #4b8d71 44% 55%, transparent 56%) 0 0 / 240px 150px repeat-x;
  clip-path: polygon(0 75%, 9% 42%, 17% 67%, 27% 25%, 39% 72%, 50% 35%, 63% 70%, 75% 18%, 87% 62%, 100% 35%, 100% 100%, 0 100%);
}

button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 4px solid #1667c1; outline-offset: 3px; }
ruby { white-space: nowrap; ruby-align: center; }
h1, h2, p, button {
  line-break: strict;
  word-break: normal;
  word-break: keep-all;
  overflow-wrap: anywhere;
  text-wrap: pretty;
}
.skip-link { position: fixed; left: 8px; top: -60px; z-index: 99; background: #fff; padding: 10px; }
.skip-link:focus { top: 8px; }

.app-header {
  height: 64px;
  max-width: 1120px;
  margin: auto;
  padding: 8px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; gap: 8px; align-items: center; border: 0; background: transparent; text-align: left; cursor: pointer; line-height: 1.05; }
.brand-kicker { display: inline-block; font-size: .58rem; font-weight: 700; letter-spacing: .04em; }
.brand strong { color: var(--grass-dark); font-size: 1.12rem; font-weight: 800; }
.brand-mark { display: grid; place-items: center; width: 42px; height: 42px; overflow: hidden; background: #fff; border: 2px solid var(--corn); border-radius: 50%; box-shadow: 0 4px 0 #d9aa25; }
.brand-mark img { width: 115%; height: 115%; object-fit: contain; }
.icon-button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(53,91,74,.17); cursor: pointer; }

main { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 8px 18px 18px; }
.screen { width: min(1080px, 100%); }
.top-screen { align-self: start; }
.hero {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 230px;
  overflow: hidden;
  text-align: center;
  margin: 4px auto 14px;
  padding: 14px 28px 18px;
  border: 4px solid #fff;
  border-radius: 30px;
  box-shadow: var(--shadow);
  background:
    linear-gradient(110deg, rgba(255,255,255,.06), rgba(20,67,47,.24)),
    url("images/memuro-aerial.jpg") center 45% / cover no-repeat;
}
.hero::after {
  content: none;
}
.hero-center {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  width: fit-content;
  max-width: 92%;
  padding: 15px clamp(22px, 4vw, 42px);
  border: 1px solid rgba(255,255,255,.82);
  border-radius: 22px;
  text-align: left;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,.18) 0%,
    rgba(255,255,255,.58) 23%,
    rgba(255,255,255,.66) 50%,
    rgba(255,255,255,.58) 77%,
    rgba(255,255,255,.18) 100%
  );
  box-shadow: 0 14px 34px rgba(24,52,43,.22);
  -webkit-backdrop-filter: blur(12px) saturate(1.12);
  backdrop-filter: blur(12px) saturate(1.12);
}
.hero-mascot {
  width: 116px;
  height: 116px;
  object-fit: contain;
  margin-right: clamp(14px, 3vw, 30px);
  filter: drop-shadow(0 7px 7px rgba(28,64,48,.22));
}
.eyebrow { margin: 0 0 4px; color: var(--grass-dark); font-size: .92rem; letter-spacing: .1em; }
h1 { margin: 0; line-height: 1.17; font-size: clamp(1.55rem, 4vw, 2.55rem); }
h1 span { color: inherit; }
.hero h1 {
  display: grid;
  gap: 2px;
  max-width: 760px;
  color: #245f3b;
  font-family: "Hiragino Maru Gothic ProN", "HG丸ｺﾞｼｯｸM-PRO", "UD Digi Kyokasho NK-R", Meiryo, sans-serif;
  font-size: clamp(2.45rem, 5.2vw, 3.75rem);
  line-height: 1.02;
  text-shadow: 0 1px 10px rgba(255,255,255,.92);
  font-feature-settings: "palt";
}
.hero-title-place {
  font-size: .54em;
  font-weight: 700;
  letter-spacing: .18em;
  color: #397250;
}
.hero-title-main {
  font-size: 1em;
  font-weight: 900;
  letter-spacing: .035em;
  white-space: nowrap;
}
.hero h1::after {
  content: none;
}

.level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.level-card {
  position: relative;
  min-height: 178px;
  padding: 23px 16px 16px;
  border: 3px solid rgba(255,255,255,.75);
  border-radius: 27px;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform .15s, box-shadow .15s;
}
.level-icon { font-size: 2.2rem; filter: drop-shadow(0 3px 0 rgba(255,255,255,.65)); }
.level-card:hover { transform: translateY(-4px); box-shadow: 0 10px 0 rgba(39,83,61,.14); }
.level-card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(39,83,61,.18); }
.beginner { background: #c9ed9d; }
.intermediate { background: #b8e8f4; }
.advanced { background: #ffe47a; }
.level-stamp { position: absolute; top: -12px; left: 16px; width: 45px; height: 45px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--grass-dark); font-size: 1.25rem; border: 3px dashed currentColor; transform: rotate(-8deg); }
.level-name { margin-top: 10px; font-size: clamp(1.3rem, 2.35vw, 1.68rem); line-height: 1.18; }
.level-sub { min-height: 1.5em; font-size: 1.08rem; margin: 5px 0 12px; }
.level-meta { margin-top: auto; padding: 8px 18px; background: rgba(255,255,255,.77); border-radius: 999px; font-size: .95rem; }
.resume-area { text-align: center; margin: -5px 0 10px; }
.resume-button { border: 0; border-radius: 999px; padding: 9px 22px; background: #fff; color: var(--grass-dark); box-shadow: 0 4px 0 rgba(39,83,61,.14); cursor: pointer; }

.quiz-screen { max-width: 900px; }
.progress-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 5px; }
.progress-row p { margin: 0; }
#questionCounter { font-size: 1.18rem; }
#scoreChip { justify-self: end; background: var(--corn); border-radius: 999px; padding: 5px 13px; }
.back-button { justify-self: start; border: 0; background: transparent; cursor: pointer; }
.progress-track { height: 9px; overflow: hidden; background: rgba(255,255,255,.8); border-radius: 999px; margin-bottom: 9px; }
#progressBar { height: 100%; width: 4%; background: linear-gradient(90deg, var(--grass), #a6d55e); border-radius: inherit; transition: width .3s; }
.question-card { background: rgba(255,255,255,.94); border: 4px solid #fff; border-radius: 27px; padding: clamp(12px, 2vw, 20px); box-shadow: var(--shadow); }
.question-main { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; align-items: center; min-height: 155px; }
.course-label { display: inline-block; margin: 0 0 8px; padding: 5px 11px; color: var(--grass-dark); background: #e1f4ce; border-radius: 999px; font-size: .9rem; }
#questionText {
  margin: 0;
  font-size: clamp(1.55rem, 3.5vw, 2.25rem);
  line-height: 1.5;
  transition: font-size .18s ease;
}
#questionText.is-long { font-size: clamp(1.38rem, 3vw, 1.95rem); }
#questionText.is-very-long { font-size: clamp(1.2rem, 2.6vw, 1.68rem); }
.image-frame { margin: 0; height: 155px; overflow: hidden; border-radius: 19px; background: #edf4e7; border: 3px solid #e4eecf; }
.image-frame img { width: 100%; height: 100%; object-fit: cover; transition: filter .45s ease, opacity .45s ease, transform .45s ease; }
.image-frame img.map-focus { object-position: center 8%; }
.image-frame figcaption { position: absolute; right: 6px; bottom: 5px; padding: 3px 7px; color: #fff; background: rgba(24,55,42,.78); border-radius: 999px; font-size: .58rem; }
.image-frame { position: relative; }
.image-curtain {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-content: center;
  gap: 4px;
  text-align: center;
  color: var(--grass-dark);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.85) 0 4px, transparent 5px),
    linear-gradient(145deg, #fff8c8, #dff1c9);
  transition: opacity .35s ease, transform .35s ease;
}
.image-curtain span { font-size: 2rem; }
.image-curtain strong { font-size: .82rem; line-height: 1.35; }
.image-frame.is-covered img { filter: blur(12px); opacity: .22; transform: scale(1.08); }
.image-frame.is-covered figcaption { opacity: 0; }
.image-frame.is-revealed img { animation: photoReveal .48s ease both; }
.image-frame.is-revealed .image-curtain { opacity: 0; transform: scale(.9); pointer-events: none; }
@keyframes photoReveal {
  from { opacity: .2; transform: scale(1.08); }
  to { opacity: 1; transform: scale(1); }
}
.question-main.no-image { grid-template-columns: 1fr; min-height: 115px; text-align: center; }
.choice-list { display: grid; gap: 9px; margin-top: 12px; }
.choice-button {
  width: 100%;
  min-height: 60px;
  border: 2px solid #dbe8d2;
  border-radius: 17px;
  background: #f9fff5;
  box-shadow: 0 4px 0 #d7e3d0;
  cursor: pointer;
  text-align: left;
  padding: 10px 17px;
  font-size: 1.12rem;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform .1s;
}
.choice-button { -webkit-tap-highlight-color: transparent; }
.choice-text {
  min-width: 0;
  line-height: 1.4;
}
.choice-button.is-long-choice { font-size: 1.02rem; }
.choice-button.is-very-long-choice { font-size: .93rem; }
@media (hover: hover) and (pointer: fine) {
  .choice-button:hover { background: #fff6c6; transform: translateY(-1px); }
}
.choice-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d7e3d0; }
.choice-button:disabled { cursor: default; }
.choice-letter { flex: 0 0 34px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--grass); }
.choice-button.correct { background: #dff4d1; border-color: var(--grass); }
.choice-button.wrong { background: #ffe6dd; border-color: var(--red); }
.feedback { margin: 10px auto 0; max-width: 720px; padding: 8px 16px; border-radius: 18px; background: #fff7c9; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 0 rgba(91,79,35,.13); }
.feedback-mascot {
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  object-fit: contain;
  filter: drop-shadow(0 3px 0 rgba(39,83,61,.13));
}
.feedback strong { color: var(--grass-dark); }
.feedback p { margin: 2px 0 0; font-size: .98rem; font-weight: 600; line-height: 1.5; }
.feedback strong { font-size: 1.08rem; }

.result-screen { max-width: 680px; text-align: center; }
.result-card { background: rgba(255,255,255,.95); border: 5px solid var(--corn); border-radius: 30px; padding: 22px; box-shadow: var(--shadow); }
.result-card.fail { border-color: var(--sky); }
.result-seal { width: 75px; height: 75px; display: grid; place-items: center; margin: -4px auto 5px; border: 4px dashed var(--grass); border-radius: 50%; font-size: 2.7rem; }
.result-card h2 { margin: 4px 0; font-size: clamp(1.7rem, 5vw, 2.65rem); color: var(--grass-dark); }
.score-display { display: flex; justify-content: center; align-items: baseline; gap: 7px; }
.score-display strong { font-size: 4rem; line-height: 1; color: #e09b00; }
#resultSummary { margin: 8px 0; }
.certificate { max-width: 470px; margin: 12px auto; padding: 11px; border: 5px double #d6a81d; background: #fffdf1; display: grid; gap: 5px; }
.certificate p { margin: 0; letter-spacing: .25em; }
.certificate strong { font-size: 1.2rem; }
.certificate span { font-size: .8rem; font-weight: 600; }
.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 14px; }
.primary-button, .secondary-button { min-height: 45px; border-radius: 14px; padding: 9px 18px; cursor: pointer; }
.primary-button { border: 0; color: #fff; background: var(--grass-dark); box-shadow: 0 4px 0 #225329; }
.secondary-button { border: 2px solid #bdd0b7; background: #fff; }

footer { min-height: 30px; text-align: center; font-size: .72rem; color: #58705e; }
ruby { ruby-align: center; }
rt { font-size: .5em; font-weight: 700; color: #315f44; }

@media (max-width: 700px) {
  .app-header { height: 56px; padding: 6px 12px; }
  main { min-height: calc(100vh - 80px); padding: 5px 10px 12px; }
  .brand { font-size: .75rem; }
  .brand-mark, .icon-button { width: 37px; height: 37px; }
  .hero { margin-bottom: 10px; min-height: 205px; padding: 10px 16px 15px; }
  .hero-center { width: fit-content; max-width: 92%; padding: 12px 22px; }
  .hero-mascot { width: 96px; height: 96px; }
  .hero h1 { font-size: clamp(2.15rem, 7vw, 3rem); }
  .level-grid { gap: 8px; }
  .level-card { min-height: 145px; padding: 20px 7px 10px; border-radius: 20px; }
  .level-icon { font-size: 1.75rem; }
  .level-stamp { width: 36px; height: 36px; top: -7px; }
  .level-sub { font-size: .9rem; }
  .level-meta { font-size: .78rem; }
  .question-main { min-height: 120px; grid-template-columns: 1.3fr .7fr; gap: 9px; }
  .image-frame { height: 120px; border-radius: 13px; }
  .choice-list { gap: 7px; margin-top: 8px; }
  .choice-button { min-height: 54px; padding: 7px 11px; font-size: 1rem; }
  .feedback { margin-top: 7px; padding: 6px 10px; }
}

@media (max-width: 470px) {
  .hero { min-height: 175px; padding: 7px 10px 12px; }
  .hero-center { width: 94%; padding: 10px 14px; border-radius: 17px; }
  .hero-mascot { width: 74px; height: 74px; margin-right: 10px; }
  .hero h1 { font-size: clamp(1.7rem, 8vw, 2.15rem); line-height: 1.06; letter-spacing: .02em; }
  .level-grid { grid-template-columns: 1fr; }
  .level-card { min-height: 92px; padding: 12px 12px 10px 60px; align-items: flex-start; justify-content: center; }
  .level-icon { position: absolute; left: 16px; bottom: 12px; font-size: 1.65rem; }
  .level-stamp { left: 12px; top: 25px; }
  .level-name { margin-top: 0; font-size: 1.22rem; }
  .level-sub { margin: 2px 0 4px; }
  .level-meta { position: absolute; right: 9px; bottom: 9px; padding: 5px 9px; }
  .question-main { grid-template-columns: 1fr; min-height: auto; text-align: center; }
  .image-frame { height: 105px; }
  #questionText { min-height: 58px; }
  .feedback p { display: none; }
}

@media (max-height: 650px) and (min-width: 600px) {
  .app-header { height: 50px; }
  main { min-height: calc(100vh - 70px); padding-top: 2px; }
  .hero { margin: 0 auto 8px; }
  .hero { min-height: 180px; }
  .hero-mascot { width: 88px; height: 88px; }
  .hero h1 { font-size: 2.35rem; }
  .level-card { min-height: 130px; }
  .question-main { min-height: 110px; }
  .image-frame { height: 110px; }
  .choice-button { min-height: 50px; font-size: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  .image-frame.is-revealed img { animation: none !important; }
}

/* 「つぎへ」ボタン（解説を読み終えたら自分のペースで進むためのボタン） */
.next-button {
  flex: 0 0 auto;
  margin-left: auto;
  min-height: 48px;
  padding: 9px 18px;
  border: 0;
  border-radius: 14px;
  color: #fff;
  background: var(--grass-dark);
  box-shadow: 0 4px 0 #225329;
  cursor: pointer;
  font-size: 1.02rem;
  white-space: nowrap;
}
.next-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #225329; }
@media (max-width: 700px) {
  .feedback { flex-wrap: wrap; }
  .next-button { margin: 4px 0 2px auto; min-height: 44px; }
}

/* ---- Phase 2: がんばりの見える化 ---- */
.rank-title { margin: 2px 4px 8px; text-align: center; font-size: 1.02rem; color: var(--grass-dark); }
.level-record { display: block; margin-top: 4px; font-size: .82rem; color: #7a6410; }

.weak-area { margin: 16px auto 4px; max-width: 720px; padding: 12px 16px; background: #fff; border: 3px dashed var(--corn); border-radius: 18px; }
.weak-title { margin: 0; font-size: 1.1rem; color: var(--grass-dark); }
.weak-sub { margin: 3px 0 8px; font-size: .85rem; font-weight: 600; }
.weak-buttons { display: grid; gap: 8px; }
.weak-button { min-height: 48px; border: 2px solid #bdd0b7; border-radius: 14px; background: #f6fbf3; padding: 8px 14px; cursor: pointer; text-align: left; font-size: .98rem; }
.weak-button:active { transform: translateY(2px); }

.combo-chip { margin: 0; padding: 2px 10px; border-radius: 999px; background: #ffe08f; font-size: .9rem; box-shadow: 0 3px 0 rgba(91,79,35,.15); }

.certificate-name { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: .9rem; }
.certificate-name input { width: 12em; max-width: 60%; min-height: 40px; border: 0; border-bottom: 2px solid #d6a81d; background: transparent; font: inherit; text-align: center; }
.certificate-name input:focus-visible { outline: 3px solid #1667c1; outline-offset: 2px; }
.certificate-date { margin: 2px 0 0; font-size: .85rem; font-weight: 600; }

.confetti { position: fixed; top: -16px; width: 10px; height: 14px; z-index: 60; pointer-events: none; border-radius: 2px; opacity: .95; animation: confetti-fall 2.2s ease-in forwards; }
@keyframes confetti-fall { to { transform: translateY(105vh) rotate(560deg); opacity: .65; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

/* ---- Phase 3: よむボタン・先生用一覧・PWA ---- */
.read-button {
  margin-top: 8px; min-height: 44px; padding: 6px 16px;
  border: 2px solid var(--grass); border-radius: 999px;
  background: #f4fbef; color: #2f6b3a; font-size: .95rem; cursor: pointer;
}
.read-button:active { transform: translateY(2px); }

.teacher-link-row { text-align: right; margin: 14px 6px 0; }
.teacher-link { background: none; border: 0; padding: 8px; color: #58755f; text-decoration: underline; cursor: pointer; font-size: .82rem; }

.teacher-screen { background: #fff; border-radius: 18px; padding: 16px 20px; }
.teacher-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.teacher-head h2 { margin: 0; font-size: 1.15rem; }
.teacher-btn { min-height: 44px; padding: 6px 14px; border: 2px solid #bdd0b7; border-radius: 12px; background: #f6fbf3; cursor: pointer; }
.teacher-btn-primary { background: var(--grass); border-color: var(--grass); color: #fff; }
.teacher-note { font-size: .82rem; color: #667; }
.teacher-item { border-bottom: 1px dashed #ccd8c6; padding: 9px 0; font-size: .9rem; line-height: 1.7; }
.teacher-item .correct-choice { font-weight: 700; color: #2f6b3a; }
#teacherList h3 { margin: 18px 0 4px; border-left: 6px solid var(--grass); padding-left: 8px; }

@media print {
  body * { visibility: hidden; }
  #teacherScreen, #teacherScreen * { visibility: visible; }
  #teacherScreen { position: absolute; inset: 0; border-radius: 0; }
  .teacher-head button { display: none; }
}

/* ---- Phase 4: あそびごころ ---- */
.mascot-button { background: none; border: 0; padding: 0; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.mascot-button:focus-visible { outline: 3px solid #1667c1; outline-offset: 4px; border-radius: 20px; }
.hero-mascot.is-bouncing { animation: mascot-bounce .55s ease; }
@keyframes mascot-bounce {
  0% { transform: translateY(0); }
  35% { transform: translateY(-16px) rotate(-4deg); }
  65% { transform: translateY(2px) rotate(3deg); }
  100% { transform: translateY(0); }
}
.mascot-bubble {
  position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
  background: #fff; color: #234; border-radius: 14px; padding: 7px 12px;
  font-size: .85rem; font-weight: 700; white-space: nowrap;
  box-shadow: 0 3px 10px rgba(30,60,30,.25); animation: bubble-pop .25s ease;
}
.mascot-bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes bubble-pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hero-mascot.is-bouncing, .mascot-bubble { animation: none; } }

.daily-card {
  margin: 12px auto 4px; max-width: 720px; padding: 12px 16px;
  background: linear-gradient(120deg, #fff4c2, #ffe9a3); border-radius: 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  box-shadow: 0 4px 0 rgba(140,110,20,.18);
}
.daily-info { display: grid; gap: 2px; }
.daily-info strong { font-size: 1.05rem; }
.daily-info span { font-size: .84rem; font-weight: 600; color: #6d5a12; }
.daily-button {
  min-height: 48px; padding: 8px 18px; border: 0; border-radius: 14px;
  background: var(--grass-dark); color: #fff; font-size: 1rem; cursor: pointer;
  box-shadow: 0 4px 0 #225329;
}
.daily-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #225329; }

.badge-link-row { text-align: center; margin: 10px 0 0; }
.badge-link { background: #fff; border: 2px solid #e3d18a; border-radius: 999px; min-height: 44px; padding: 6px 18px; cursor: pointer; font-size: .92rem; }
.badge-screen { background: #fff; border-radius: 18px; padding: 16px 20px; }
.badge-count { font-weight: 700; color: #6d5a12; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.badge-card { border: 2px solid #e8e2c8; border-radius: 16px; padding: 12px; display: grid; gap: 3px; background: #fffdf4; }
.badge-card .badge-icon { font-size: 1.9rem; }
.badge-card strong { font-size: .95rem; }
.badge-card small { color: #667; }
.badge-card.locked { filter: grayscale(1); opacity: .62; }

/* ---- Phase 5: けいけんち・カレンダー ---- */
.xp-row { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 2px auto 6px; padding: 0 6px; }
.xp-level { color: var(--grass-dark); font-size: .95rem; white-space: nowrap; }
.xp-bar { flex: 1; height: 12px; border-radius: 999px; background: #e6e2cd; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
.xp-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--grass), #ffd84d); transition: width .5s ease; }
.xp-next { font-size: .78rem; font-weight: 700; color: #7a6410; white-space: nowrap; }
.level-up-note { margin: 6px 0 0; font-weight: 700; color: #b07a00; }

.calendar-title { margin: 14px 0 6px; font-size: 1rem; }
.stamp-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 430px; }
.stamp-calendar .cal-head { text-align: center; font-size: .7rem; font-weight: 700; color: #667; }
.stamp-calendar .cal-day {
  min-height: 34px; display: grid; place-items: center; border-radius: 9px;
  background: #f6f4e8; font-size: .78rem; color: #556;
}
.stamp-calendar .cal-day.stamped { background: #ffe9a3; font-size: 1rem; }
.stamp-calendar .cal-day.today { outline: 2px solid var(--grass-dark); }
.stamp-calendar .cal-day.empty { background: transparent; }

/* ---- Phase 5: 1画面に収めるコンパクト表示(Chromebook想定) ---- */
@media (min-width: 860px) and (max-height: 880px) {
  main { padding: 4px 18px 8px; align-items: start; }
  .app-header { height: 50px; }
  .hero { min-height: 128px; margin: 2px auto 8px; padding: 8px 22px; }
  .hero-center { padding: 8px clamp(16px, 3vw, 28px); }
  .hero-mascot { width: 84px; height: 84px; }
  .eyebrow { font-size: .8rem; margin-bottom: 2px; }
  h1 { font-size: clamp(1.3rem, 3vw, 1.9rem); }
  .rank-title { margin: 0 4px 4px; font-size: .92rem; }
  .xp-row { margin: 0 auto 4px; }
  .daily-card { margin: 6px auto 2px; padding: 8px 14px; }
  .daily-info strong { font-size: .95rem; }
  .daily-button { min-height: 44px; padding: 6px 14px; }
  .badge-link-row { margin: 4px 0 0; }
  .badge-link { min-height: 38px; padding: 4px 14px; font-size: .84rem; }
  .level-grid { gap: 10px; }
  .level-card { padding: 12px 14px; }
  .weak-area { margin: 8px auto 0; padding: 8px 14px; }
  .weak-button { min-height: 44px; padding: 6px 12px; }
  .teacher-link-row { margin: 4px 6px 0; }
  .teacher-link { padding: 4px; }

  /* クイズ画面 */
  .question-card { padding: 10px 16px; }
  .image-frame { height: clamp(96px, 17vh, 150px); }
  #questionText { font-size: clamp(1.05rem, 2.3vw, 1.5rem); }
  .choice-list { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice-button { min-height: 56px; }
  .read-button { margin-top: 4px; min-height: 38px; padding: 4px 12px; font-size: .85rem; }
  .feedback { padding: 8px 12px; }
}

/* ============================================================
   Phase 6: 仕上げの統一(プロっぽさは「細部の揃い」から)
   ============================================================ */
/* 学習向け丸ゴシック(同梱・オフライン可) */
@font-face {
  font-family: "Zen Maru Gothic";
  src: url("zen-maru-regular.woff2") format("woff2");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "Zen Maru Gothic";
  src: url("zen-maru-bold.woff2") format("woff2");
  font-weight: 700; font-display: swap;
}
body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", system-ui, sans-serif; }

/* 統一トークン: 影と枠線は全カード共通に */
:root {
  --shadow-soft: 0 12px 28px -14px rgba(31, 58, 40, .30);
  --line-soft: #e7e0c4;
}
.level-card, .question-card, .daily-card, .weak-area, .teacher-screen, .badge-screen { box-shadow: var(--shadow-soft); }
.weak-area { border: 2px solid var(--line-soft); background: #fffdf4; }
.daily-card { background: #fff3bd; border: 2px solid #f0dc94; }

/* ヘッダーをうっすら固定感のある仕上がりに */
.app-header { background: rgba(255, 252, 240, .92); border-bottom: 1px solid rgba(47, 107, 58, .14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

/* 数字の桁ぞろえ(カウンター・スコア・けいけんち) */
#questionCounter, #scoreChip, .xp-next, .badge-count, #resultScore { font-variant-numeric: tabular-nums; }

/* マウス操作の端末だけ、カードがふわっと反応 */
@media (hover: hover) {
  .level-card, .badge-card, .daily-button, .weak-button { transition: transform .15s ease, box-shadow .15s ease; }
  .level-card:hover, .badge-card:hover { transform: translateY(-3px); }
}

/* キーボード操作の見え方を全部品で統一 */
button:focus-visible, input:focus-visible { outline: 3px solid #1667c1; outline-offset: 2px; }

/* 認定証: 金の二重枠で「ほんもの感」 */
#certificate {
  border: 3px solid #d8b64a;
  box-shadow: inset 0 0 0 4px #fffdf4, inset 0 0 0 6px #e8d296, var(--shadow-soft);
  background: linear-gradient(160deg, #fffef8, #fdf6dd);
}

/* ============================================================
   Phase 7: デザイン再構成(絵文字→統一アイコン・箱と色の整理)
   ============================================================ */
.ui-icon { width: 1.2em; height: 1.2em; vertical-align: -0.22em; margin-right: .3em; flex: 0 0 auto; }
.icon-heading { display: flex; align-items: center; gap: 2px; }

/* ステータス帯: 称号+けいけんちを1枚の白いカードに */
.status-band {
  background: #fff; border: 2px solid var(--line-soft); border-radius: 20px;
  padding: 10px 18px 12px; margin: 0 0 12px; box-shadow: var(--shadow-soft);
  display: grid; gap: 7px;
}
.status-band .rank-title { margin: 0; text-align: left; }
.status-band .xp-row { margin: 0; padding: 0; max-width: none; }

/* 幅を1本に揃える(端のガタつき解消) */
.daily-card, .weak-area { max-width: none; }

/* きょうのちょうせん: ベタ塗り→白地+コーン色の差し色 */
.daily-card { background: #fff; border: 2px solid var(--line-soft); border-left: 10px solid #f4c531; }
.daily-heading { display: flex; align-items: center; color: #8a6d0d; }
.daily-heading .ui-icon { color: #e8a713; width: 1.35em; height: 1.35em; }

/* バッジずかんリンク */
.badge-link { display: inline-flex; align-items: center; }
.badge-link .ui-icon { color: #c9962a; }

/* コースカード: ベタ塗り3色→白いカード+上端の差し色 */
.level-card.beginner { --accent: #5aa845; }
.level-card.intermediate { --accent: #3d93b8; }
.level-card.advanced { --accent: #d9a514; }
.level-card, .level-card.beginner, .level-card.intermediate, .level-card.advanced {
  background: #fff;
  border: 2px solid var(--line-soft);
  border-top: 8px solid var(--accent);
  border-radius: 20px;
}
.level-stamp {
  border: 0; transform: none; top: -14px;
  background: var(--accent); color: #fff;
  box-shadow: 0 3px 0 rgba(31, 58, 40, .18);
}
.level-icon { color: var(--accent); filter: none; }
.level-icon .ui-icon { width: 46px; height: 46px; margin: 2px 0 0; }
.level-sub { color: #66705f; }
.level-meta { background: #f2f7ec; color: var(--grass-dark); }
.level-record { color: #8a6d0d; }

/* にがてノート */
.weak-title { display: flex; align-items: center; }
.weak-title .ui-icon { color: var(--grass-dark); }

/* よむボタン */
.read-button { display: inline-flex; align-items: center; }

/* ヒーロー: 曇りガラス→くっきりした白いカードに */
.hero-center {
  background: #fff;
  border: 0;
  -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: 0 12px 28px rgba(24, 52, 43, .22);
}
.hero-mascot { width: 132px; height: 132px; }

/* コンパクト表示時のステータス帯 */
@media (min-width: 860px) and (max-height: 880px) {
  .status-band { padding: 7px 14px 9px; gap: 4px; margin-bottom: 8px; }
  .hero-mascot { width: 92px; height: 92px; }
}

/* ============================================================
   Phase 8: クライマックス演出と日本語改行の改善
   ============================================================ */
/* 日本語の折り返しを賢く: 見出しは行の長さを均等に、本文は最後の行が短くなりすぎないように */
h1, h2, h3, .level-name, #resultTitle, .rank-title, .weak-sub { text-wrap: balance; }
p, #resultSummary, .teacher-note, .certificate-body { text-wrap: pretty; }
.certificate-body { display: block; max-width: 26em; margin: 4px auto; text-wrap: balance; }

/* 結果画面のまちるだいすけ(絵文字サークルを卒業) */
.result-seal {
  width: 96px; height: 96px; margin: 0 auto 6px;
  border: 0; background: #fff; border-radius: 50%;
  box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--corn), 0 8px 18px rgba(31,58,40,.2);
  display: grid; place-items: center; overflow: hidden;
}
.result-seal img { width: 78%; height: 78%; object-fit: contain; }
.result-card.fail .result-seal { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #cfd8c6, 0 8px 18px rgba(31,58,40,.15); }
@keyframes seal-hop { 0%{transform:translateY(0)} 30%{transform:translateY(-10px)} 60%{transform:translateY(2px)} 100%{transform:translateY(0)} }
.result-seal.is-happy { animation: seal-hop .7s ease .2s 2; }

/* 点数のカウントアップ演出 */
@keyframes score-pop { 0%{transform:scale(.7)} 70%{transform:scale(1.12)} 100%{transform:scale(1)} }
#resultScore.is-counting { display: inline-block; animation: score-pop .5s ease; }

/* レベルアップをチップ表示に */
.level-up-note {
  display: inline-block; margin: 8px auto 0; padding: 6px 16px;
  background: linear-gradient(100deg, #fff3c4, #ffe28a); border-radius: 999px;
  box-shadow: 0 3px 0 rgba(140,110,20,.25); color: #7a5b00;
}

/* 「ごうかく」はんこ: 日本の認定証らしさの決め手 */
.certificate { position: relative; }
.pass-stamp {
  position: absolute; right: 14px; bottom: 12px;
  width: 74px; height: 74px; display: grid; place-items: center;
  border: 3.5px solid #d33a2c; border-radius: 50%;
  box-shadow: inset 0 0 0 2.5px #fff, inset 0 0 0 5px #d33a2c;
  color: #d33a2c; font-weight: 700; font-size: 1.05rem; line-height: 1.15; text-align: center;
  transform: rotate(-12deg); opacity: .92; background: rgba(255,255,255,.6);
}
@keyframes stamp-in {
  0% { transform: rotate(-12deg) scale(2.1); opacity: 0; }
  60% { transform: rotate(-12deg) scale(.94); opacity: 1; }
  100% { transform: rotate(-12deg) scale(1); opacity: .92; }
}
.pass-stamp.is-stamping { animation: stamp-in .45s cubic-bezier(.2,.9,.3,1.4) .55s backwards; }
@media (max-width: 700px) { .pass-stamp { width: 60px; height: 60px; font-size: .9rem; right: 8px; bottom: 8px; } }

/* 紙吹雪v2: 大きさと形にばらつき+横に流れる */
@keyframes confetti-drift {
  to { transform: translate(var(--dx, 0px), 106vh) rotate(var(--spin, 540deg)); opacity: .6; }
}
.confetti { animation-name: confetti-drift; }
@media (prefers-reduced-motion: reduce) {
  .result-seal.is-happy, #resultScore.is-counting, .pass-stamp.is-stamping { animation: none; }
}

/* アイコンの「設計された感」: カードのアイコンを淡い色の丸チップに */
.level-icon {
  width: 66px; height: 66px; border-radius: 50%;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 13%, #fff);
}
.level-icon .ui-icon { width: 36px; height: 36px; margin: 0; }
.ui-icon { stroke-width: 2.1; }

/* ============================================================
   Phase 9: 絵文字全廃・背景と枠の質感・日本語改行の仕上げ
   ============================================================ */
/* 背景: 斜めストライプと色の段差をやめ、空→畑のなだらかなグラデーションに */
body { background: linear-gradient(180deg, #e2f4fc 0%, #f4eed2 46%, #f9f3d4 100%); line-break: strict; }

/* 結果画面: 太い黄フチ→上質な白カード(金は認定証とリングに集約) */
.result-card, .result-card.fail { border: 1px solid var(--line-soft); border-radius: 22px; box-shadow: var(--shadow-soft); background: #fff; }
.question-card { border: 1px solid var(--line-soft); border-radius: 22px; }

/* プログラムが差し込むアイコンの色と大きさ */
#scoreChip .ui-icon, .xp-level .ui-icon { color: #e0a300; width: 1.05em; height: 1.05em; }
.combo-chip .ui-icon, .daily-info .ui-icon { color: #e2762d; width: 1.05em; height: 1.05em; margin-right: .2em; }
.stamp-calendar .cal-day.stamped { color: #e8a713; }
.stamp-calendar .cal-day.stamped .ui-icon { width: 20px; height: 20px; margin: 0; }
.icon-button .ui-icon { width: 20px; height: 20px; margin: 0; }
#resultKicker .ui-icon { color: #e8a713; }

/* バッジ: 絵文字→色付きメダル(白い図案) */
.badge-medal { width: 54px; height: 54px; border-radius: 50%; background: var(--bc); color: #fff; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 6px rgba(31,58,40,.18); }
.badge-medal .ui-icon { width: 30px; height: 30px; margin: 0; }
.badge-card.locked { filter: none; opacity: .78; }
.badge-card.locked strong { color: #8f8f85; }

/* 日本語の折り返し: 分かち書きの文は ことばのまとまりでだけ折る */
#resultSummary, #dailyStatus, .weak-sub, .rank-title, .level-sub, #feedbackTitle, .daily-heading { word-break: keep-all; overflow-wrap: break-word; }
.wb { display: inline-block; }
#feedbackText, #questionText { text-wrap: pretty; }

/* ============================================================
   Phase 10: 賞状らしい認定証と、ことばのまとまりで折り返す改行
   ============================================================ */
/* 改行: あらかじめ焼き込んだ区切り(wbr)と句読点でだけ折り返す */
#questionText, #feedbackText, #feedbackAnswer, .certificate-body {
  word-break: keep-all; overflow-wrap: break-word;
}

/* まちるだいすけの後光(全問正解のときだけ) */
.result-card { position: relative; overflow: hidden; }
.result-seal { position: relative; z-index: 1; }
.seal-rays {
  position: absolute; top: -26px; left: 50%; margin-left: -105px;
  width: 210px; height: 210px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(240, 197, 49, .30) 0 9deg, transparent 9deg 26deg);
  -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 68%);
  mask-image: radial-gradient(circle, #000 24%, transparent 68%);
  opacity: 0; pointer-events: none;
}
.seal-rays.show { opacity: 1; animation: rays-spin 16s linear infinite; }
@keyframes rays-spin { to { transform: rotate(360deg); } }

/* 認定証: 賞状の文法(飾り枠・ロゼット・すかし・光) */
.certificate {
  position: relative; overflow: hidden;
  padding: 20px 24px 18px; border-width: 4px;
  box-shadow: inset 0 0 0 5px #fffdf4, inset 0 0 0 7px #e2c169, var(--shadow-soft);
}
.certificate > * { position: relative; z-index: 1; }
.cert-corner { position: absolute; top: 10px; left: 10px; width: 24px; height: 24px; z-index: 1; }
.cert-corner::before { content: ""; position: absolute; inset: 0; border-top: 2px solid #c9a227; border-left: 2px solid #c9a227; }
.cert-corner::after { content: ""; position: absolute; top: 4px; left: 4px; width: 6px; height: 6px; background: #c9a227; transform: rotate(45deg); }
.cert-corner.tr { left: auto; right: 10px; transform: scaleX(-1); }
.cert-corner.bl { top: auto; bottom: 10px; transform: scaleY(-1); }
.cert-corner.br { top: auto; left: auto; right: 10px; bottom: 10px; transform: scale(-1); }
.cert-rosette { position: absolute; top: -4px; left: 16px; width: 46px; color: #c9a227; z-index: 2; filter: drop-shadow(0 2px 2px rgba(90, 60, 0, .25)); }
.cert-watermark { position: absolute; inset: 0; display: grid; place-items: center; color: #8a6d0d; opacity: .07; z-index: 0; pointer-events: none; }
.cert-watermark svg { width: 46%; height: auto; }

/* 登場時に光がスッと走る */
.certificate::after {
  content: ""; position: absolute; top: -10%; bottom: -10%; left: -60%; width: 38%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .9), transparent);
  transform: skewX(-16deg); z-index: 2; pointer-events: none;
  animation: cert-shine 1.1s ease .9s both;
}
@keyframes cert-shine { to { left: 130%; } }

/* はんこの格上げ: ひと回り大きく・深い朱色・少し傾いて堂々と */
.pass-stamp {
  width: 86px; height: 86px; right: 16px; bottom: 14px;
  border-color: #c9302c; color: #c9302c; font-size: 1.2rem;
  border-width: 4px;
  box-shadow: inset 0 0 0 3px #fffdf4, inset 0 0 0 5.5px #c9302c;
  background: rgba(255, 253, 244, .55);
}
@media (max-width: 700px) { .pass-stamp { width: 66px; height: 66px; font-size: .95rem; } }
@media (prefers-reduced-motion: reduce) {
  .seal-rays.show { animation: none; }
  .certificate::after { animation: none; left: 130%; }
}

</style>
</head>

  <main id="main">

  <script>
/* ============================================================
   アプリの動きの仕組み（普段は編集しないファイル）
   ------------------------------------------------------------
   問題の表示・採点・進捗保存などの処理です。
   問題を増やす/直すだけなら js/data.js だけで完結します。
   ============================================================ */
"use strict";

const STORAGE_KEY = "memuro-tanken-progress-v1";

/* ---- がんばりの記録(コースごとの最高記録・にがてノート) ----
   まちがえた問題は「問題文」で覚えます。data.js の問題を
   増減して番号がずれても、にがてノートが壊れないためです。
   名前などの個人情報は絶対に保存しません。 */
const RECORDS_KEY = "memuro-tanken-records-v1";
let records = loadRecords();
function loadRecords() {
  try {
    const saved = JSON.parse(localStorage.getItem(RECORDS_KEY));
    if (saved && typeof saved === "object") {
      return { best: saved.best || {}, perfect: saved.perfect || {}, maxCombo: saved.maxCombo || 0, weak: saved.weak || {}, daily: saved.daily || { dates: [] }, xp: saved.xp || 0 };
    }
  } catch { /* 破損時は初期化 */ }
  return { best: {}, perfect: {}, maxCombo: 0, weak: {}, daily: { dates: [] }, xp: 0 };
}
function saveRecords() { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); }
function weakQueue(level) {
  return (records.weak[level] || [])
    .map((text) => questions.findIndex((q) => q.level === level && q.question === text))
    .filter((index) => index >= 0);
}
function addWeak(level, text) {
  const list = records.weak[level] || (records.weak[level] = []);
  if (!list.includes(text)) { list.push(text); saveRecords(); }
}
function removeWeak(level, text) {
  const list = records.weak[level];
  if (!list) return;
  const at = list.indexOf(text);
  if (at >= 0) { list.splice(at, 1); saveRecords(); }
}
const screens = [...document.querySelectorAll(".screen")];
const $ = (id) => document.getElementById(id);

let state = {
  level: null,
  queue: [],
  index: 0,
  score: 0,
  wrong: [],
  reviewMode: false,
  sound: true,
  locked: false,
  currentChoices: []
};

function getLevelQuestions(level) {
  return questions.filter((item) => item.level === level);
}

// 将来ランダム出題にする場合は、この関数の返り値をシャッフルします。
function buildQuestionQueue(level) {
  return getLevelQuestions(level).map((item) => questions.indexOf(item));
}

function shuffleChoices(item) {
  const choices = item.choices.map((text, originalIndex) => ({ text, originalIndex }));
  for (let index = choices.length - 1; index > 0; index -= 1) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [choices[index], choices[randomIndex]] = [choices[randomIndex], choices[index]];
  }
  const unchanged = choices.every((choice, index) => choice.originalIndex === index);
  if (unchanged) [choices[0], choices[1]] = [choices[1], choices[0]];
  return choices;
}

const speechSupported = "speechSynthesis" in window;
function stopSpeech() { if (speechSupported) window.speechSynthesis.cancel(); }
function speakCurrent() {
  if (!speechSupported) return;
  const item = questions[state.queue[state.index]];
  if (!item) return;
  const parts = $("feedback").hidden
    ? [item.question, ...state.currentChoices.map((choice, i) => `${i + 1}。${choice.text}`)]
    : [item.explanation];
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(parts.join("。"));
  utterance.lang = "ja-JP";
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function showScreen(id) {
  stopSpeech();
  screens.forEach((screen) => { screen.hidden = screen.id !== id; });
  if (id === "topScreen") renderTopScreen();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startQuiz(level, queue = buildQuestionQueue(level), reviewMode = false) {
  state = { ...state, level, queue, index: 0, score: 0, wrong: [], reviewMode, locked: false, currentChoices: [], combo: 0, dailyMode: false, xpAtStart: records.xp || 0 };
  $("comboChip").hidden = true;
  showScreen("quizScreen");
  renderQuestion();
  saveProgress();
}

function renderQuestion() {
  const item = questions[state.queue[state.index]];
  const total = state.queue.length;
  const displayTotal = state.reviewMode ? total : 25;
  $("questionCounter").innerHTML = `<ruby>第<rt>だい</rt></ruby>${state.index + 1}<ruby>問<rt>もん</rt></ruby> / ${displayTotal}<ruby>問<rt>もん</rt></ruby>`;
  $("scoreChip").innerHTML = `${SVGI.star}${state.score}`;
  $("levelLabel").innerHTML = state.dailyMode
    ? `${SVGI.sun}きょうの ちょうせん`
    : `${kidHtml(levelInfo[state.level].name)}（${kidHtml(levelInfo[state.level].label)}）${state.reviewMode ? `・${kidHtml("復習")}` : ""}`;
  const questionElement = $("questionText");
  setKidHtml(questionElement, item.question);
  questionElement.classList.toggle("is-long", item.question.length >= 22);
  questionElement.classList.toggle("is-very-long", item.question.length >= 32);
  $("progressBar").style.width = `${((state.index + 1) / total) * 100}%`;
  document.querySelector(".progress-track").setAttribute("aria-valuemax", total);
  document.querySelector(".progress-track").setAttribute("aria-valuenow", state.index + 1);
  $("feedback").hidden = true;
  state.locked = false;
  state.currentChoices = shuffleChoices(item);

  const main = document.querySelector(".question-main");
  if (item.image) {
    main.classList.remove("no-image");
    $("imageFrame").hidden = false;
    $("imageFrame").classList.add("is-covered");
    $("imageFrame").classList.remove("is-revealed");
    $("questionImage").src = `images/${item.image}`;
    $("questionImage").classList.toggle("map-focus", item.image === "memuro-map.jpg");
    $("questionImage").alt = "もんだいの てがかりになる しゃしん";
    setKidHtml($("imageCredit"), imageCredits[item.image] || "写真：地域学習書「めむろ学」");
    $("questionImage").onerror = () => {
      $("questionImage").onerror = null;
      $("questionImage").src = "images/placeholder.jpg";
      $("questionImage").alt = "めむろちょうの はたけと ひだかさんみゃくの イメージ（しゃしん じゅんびちゅう）";
      setKidHtml($("imageCredit"), "写真準備中");
    };
  } else {
    main.classList.add("no-image");
    $("imageFrame").hidden = true;
    $("imageFrame").classList.remove("is-covered", "is-revealed");
    $("questionImage").classList.remove("map-focus");
    $("questionImage").removeAttribute("src");
  }

  $("choiceList").replaceChildren(...state.currentChoices.map((choice, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice-button";
    button.classList.toggle("is-long-choice", choice.text.length >= 14);
    button.classList.toggle("is-very-long-choice", choice.text.length >= 22);
    button.innerHTML = `<span class="choice-letter">${String.fromCharCode(65 + index)}</span><span class="choice-text">${kidHtml(choice.text)}</span>`;
    button.addEventListener("click", () => chooseAnswer(index));
    return button;
  }));
}

function chooseAnswer(selected) {
  if (state.locked) return;
  state.locked = true;
  const item = questions[state.queue[state.index]];
  const correct = state.currentChoices[selected].originalIndex === item.answer;
  const buttons = [...document.querySelectorAll(".choice-button")];
  buttons.forEach((button, index) => {
    button.disabled = true;
    if (state.currentChoices[index].originalIndex === item.answer) button.classList.add("correct");
    if (index === selected && !correct) button.classList.add("wrong");
  });
  if (item.image) {
    $("imageFrame").classList.remove("is-covered");
    $("imageFrame").classList.add("is-revealed");
  }

  if (correct) {
    state.score += 1;
    if ($("feedbackMascot")) $("feedbackMascot").src = "images/machiru-wave.png";
    setKidHtml($("feedbackTitle"), ["やったね！", "すごい！", "いい調子！"][state.index % 3]);
    playTone(660);
    state.combo = (state.combo || 0) + 1;
    removeWeak(item.level, item.question);
    addXp(10);
    if (state.combo >= 2) {
      $("comboChip").hidden = false;
      $("comboChip").innerHTML = `${SVGI.flame}${state.combo}れんぞく！`;
    }
    if (state.combo > records.maxCombo) { records.maxCombo = state.combo; saveRecords(); }
    if (state.combo % 5 === 0) launchConfetti(18);
  } else {
    state.wrong.push(state.queue[state.index]);
    if ($("feedbackMascot")) $("feedbackMascot").src = "images/machiru-front.png";
    setKidHtml($("feedbackTitle"), ["次はいけるよ！", "だいじょうぶ、発見できたね！"][state.index % 2]);
    playTone(330);
    state.combo = 0;
    $("comboChip").hidden = true;
    addWeak(item.level, item.question);
  }
  $("scoreChip").innerHTML = `${SVGI.star}${state.score}`;
  $("feedbackText").innerHTML = `${kidHtml(item.explanation)}（${kidHtml(item.source)}）`;
  $("feedback").hidden = false;
  const isLast = state.index + 1 >= state.queue.length;
  setKidHtml($("nextButton"), isLast ? "けっかを みる ▶" : "つぎへ ▶");
  $("nextButton").focus();
}

function nextQuestion() {
  stopSpeech();
  state.index += 1;
  if (state.index < state.queue.length) {
    renderQuestion();
    saveProgress();
  } else {
    showResult();
  }
}

function animateScore(target) {
  const el = $("resultScore");
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced || !window.requestAnimationFrame || target === 0) { el.textContent = target; return; }
  el.classList.remove("is-counting");
  void el.offsetWidth;
  el.classList.add("is-counting");
  const duration = 750;
  const start = performance.now();
  function tick(now) {
    const progress = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(target * eased);
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function showResult() {
  localStorage.removeItem(STORAGE_KEY);
  updateResumeButton();
  showScreen("resultScreen");
  const total = state.queue.length;
  const passed = !state.reviewMode && total === 25 && state.score === 25;
  $("resultCard").classList.toggle("fail", !passed);
  animateScore(state.score);
  document.querySelector(".score-display span").innerHTML = `/ ${total}<ruby>点<rt>てん</rt></ruby>`;
  $("resultKicker").innerHTML = `${kidHtml(levelInfo[state.level].name)}（${kidHtml(levelInfo[state.level].label)}）`;
  setKidHtml($("resultTitle"), passed ? "たんけんクリア！" : state.reviewMode ? "復習できたね！" : "もう一回チャレンジ！");
  $("resultSummary").textContent = passed
    ? "25もん すべてせいかい！ めむろちょうの たんけんめいじんです。"
    : `${total}もんちゅう ${state.score}もんせいかい。まちがいも、あたらしいはっけんへのいっぽだよ。`;
  $("certificate").hidden = !passed;
  $("certificateCourse").innerHTML = `${kidHtml(levelInfo[state.level].name)} ${kidHtml(levelInfo[state.level].label)}`;
  $("reviewButton").hidden = state.wrong.length === 0;
  $("reviewButton").textContent = `まちがいふくしゅう（${state.wrong.length}もん）`;
  if (!state.reviewMode && total === 25) {
    if (state.score > (records.best[state.level] || 0)) records.best[state.level] = state.score;
    if (state.score === 25) { if (!records.perfect[state.level]) addXp(50); records.perfect[state.level] = true; }
    saveRecords();
  }
  $("resultSeal").classList.toggle("is-happy", passed);
  $("sealRays").classList.toggle("show", passed);
  if (passed) {
    $("certificateName").value = "";  // 名前は毎回まっさら(保存しない)
    $("certificateDate").innerHTML = todayHtml();
    const stamp = $("passStamp");
    stamp.classList.remove("is-stamping");
    void stamp.offsetWidth;
    stamp.classList.add("is-stamping");
    launchConfetti(50);
    setTimeout(() => launchConfetti(28), 600);
  }
  if (state.dailyMode) {
    $("resultKicker").innerHTML = `${SVGI.sun}きょうの ちょうせん`;
    setKidHtml($("resultTitle"), state.score === total ? "きょうも クリア！" : "ちょうせん おわり！");
    records.daily = records.daily || { dates: [] };
    if (!records.daily.dates.includes(todayKey())) {
      records.daily.dates.push(todayKey());
      if (records.daily.dates.length > 400) records.daily.dates = records.daily.dates.slice(-400);
      addXp(20);
      saveRecords();
      launchConfetti(24);
    }
  }
  const newLevel = levelOf(records.xp || 0);
  const leveledUp = newLevel > levelOf(state.xpAtStart || 0);
  $("levelUpNote").hidden = !leveledUp;
  if (leveledUp) {
    $("levelUpNote").textContent = `レベルアップ！ いま Lv.${newLevel}`;
    launchConfetti(26);
  }
  playTone(passed ? 880 : 440);
}

/* ---- けいけんちとレベル: 正解+10 / デイリー初クリア+20 / 全問正解+50 ---- */
function levelOf(xp) { return Math.floor(xp / 100) + 1; }
function addXp(amount) { records.xp = (records.xp || 0) + amount; saveRecords(); }

function todayKey(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dailyDates() { return (records.daily && records.daily.dates) || []; }
function dailyDoneToday() { return dailyDates().includes(todayKey()); }
function dailyStreak() {
  const dates = new Set(dailyDates());
  let streak = 0;
  let offset = dates.has(todayKey()) ? 0 : -1;
  while (dates.has(todayKey(offset))) { streak += 1; offset -= 1; }
  return streak;
}
function dailyQueue() {
  // 日付から決まる乱数で、全コースから毎日ちがう5問を選ぶ(その日じゅうは全員同じ5問)
  let seed = Number(todayKey().replace(/-/g, ""));
  const rand = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pool = questions.map((_, index) => index);
  const picks = [];
  for (let k = 0; k < 5 && pool.length > 0; k += 1) {
    picks.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
  }
  return picks;
}
function startDailyChallenge() {
  const queue = dailyQueue();
  startQuiz(questions[queue[0]].level, queue, true);
  state.dailyMode = true;
  renderQuestion();
}

  { glyph: "map", color: "#5aa845", name: "まちはかせ", desc: "まちたんけんで ぜんもん せいかい", check: (r) => !!r.perfect.beginner },
  { glyph: "tractor", color: "#3d93b8", name: "くらしはかせ", desc: "くらし・しごとたんけんで ぜんもん せいかい", check: (r) => !!r.perfect.intermediate },
  { glyph: "gate", color: "#d9a514", name: "れきしはかせ", desc: "れきし・ぶんかたんけんで ぜんもん せいかい", check: (r) => !!r.perfect.advanced },
  { glyph: "crown", color: "#c9962a", name: "でんせつの たんけんめいじん", desc: "3つの コース ぜんぶで ぜんもん せいかい", check: (r) => ["beginner", "intermediate", "advanced"].every((l) => r.perfect[l]) },
  { glyph: "flame", color: "#e2762d", name: "5れんぞく！", desc: "5もん れんぞくで せいかい した", check: (r) => r.maxCombo >= 5 },
  { glyph: "flame", color: "#c94f2c", name: "10れんぞく！！", desc: "10もん れんぞくで せいかい した", check: (r) => r.maxCombo >= 10 },
  { glyph: "sun", color: "#e8a713", name: "きょうの ちょうせん デビュー", desc: "きょうの ちょうせんを はじめて クリア", check: () => dailyDates().length >= 1 },
  { glyph: "calendar", color: "#3d93b8", name: "5にち たっせい", desc: "きょうの ちょうせんを 5にち クリア", check: () => dailyDates().length >= 5 },
  { glyph: "trophy", color: "#c9962a", name: "20にち たっせい", desc: "きょうの ちょうせんを 20にち クリア", check: () => dailyDates().length >= 20 }
];
function earnedBadgeCount() { return badgeDefs.filter((b) => b.check(records)).length; }
function renderStampCalendar() {
  const wrap = $("stampCalendar");
  wrap.replaceChildren();
  const heads = ["にち", "げつ", "か", "すい", "もく", "きん", "ど"];
  for (const h of heads) {
    const cell = document.createElement("div");
    cell.className = "cal-head";
    cell.textContent = h;
    wrap.appendChild(cell);
  }
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();
  const stamped = new Set(dailyDates());
  for (let blank = 0; blank < first; blank += 1) {
    const cell = document.createElement("div");
    cell.className = "cal-day empty";
    wrap.appendChild(cell);
  }
  for (let day = 1; day <= days; day += 1) {
    const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const cell = document.createElement("div");
    cell.className = "cal-day" + (stamped.has(key) ? " stamped" : "") + (key === todayKey() ? " today" : "");
    cell.innerHTML = stamped.has(key) ? SVGI.sunFill : String(day);
    wrap.appendChild(cell);
  }
}

function renderBadges() {
  renderStampCalendar();
  $("badgeCount").textContent = `あつめた バッジ：${earnedBadgeCount()} / ${badgeDefs.length}`;
  $("badgeGrid").replaceChildren(...badgeDefs.map((badge) => {
    const earned = badge.check(records);
    const card = document.createElement("div");
    card.className = "badge-card" + (earned ? "" : " locked");
    card.innerHTML = `<span class="badge-medal" style="--bc:${earned ? badge.color : "#b3b3a8"}">${SVGI[earned ? badge.glyph : "lock"]}</span><strong>${earned ? badge.name : "？？？"}</strong><small>${badge.desc}</small>`;
    return card;
  }));
}

function renderTopScreen() {
  const doneToday = dailyDoneToday();
  const streak = dailyStreak();
  $("dailyStatus").innerHTML = doneToday
    ? `きょうは クリア！${streak >= 1 ? ` ${SVGI.flame}${streak}にち れんぞく` : ""}`
    : `まいにち かわる 5もん。${streak > 0 ? `いま ${SVGI.flame}${streak}にち れんぞく！` : "ぜんコースから しゅつだい！"}`;
  $("dailyButton").textContent = doneToday ? "もういちど あそぶ" : "5もんに ちょうせん！";
  const xp = records.xp || 0;
  $("xpLevel").innerHTML = `${SVGI.star}Lv.${levelOf(xp)}`;
  $("xpFill").style.width = `${xp % 100}%`;
  $("xpNext").textContent = `つぎのレベルまで あと${100 - (xp % 100)}`;
  $("badgeLinkLabel").textContent = `バッジずかん（${earnedBadgeCount()} / ${badgeDefs.length}）`;
  const levels = Object.keys(levelInfo);
  const perfectCount = levels.filter((level) => records.perfect[level]).length;
  const rankNames = ["みならい たんけんか", "かけだし たんけんか", "いちにんまえの たんけんか", "でんせつの たんけんめいじん"];
  $("rankTitle").textContent = `きみは いま… ${rankNames[perfectCount]}`;
  document.querySelectorAll(".level-card").forEach((card) => {
    const level = card.dataset.level;
    const span = card.querySelector(".level-record");
    const best = records.best[level];
    if (best === undefined) { span.hidden = true; return; }
    span.hidden = false;
    span.innerHTML = `${records.perfect[level] ? SVGI.crown : SVGI.star}さいこう ${best}もん`;
  });
  const entries = levels
    .map((level) => ({ level, count: weakQueue(level).length }))
    .filter((entry) => entry.count > 0);
  $("weakArea").hidden = entries.length === 0;
  $("weakButtons").replaceChildren(...entries.map(({ level, count }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "weak-button";
    button.innerHTML = `${kidHtml(levelInfo[level].name)}の にがて ${count}もんに ちょうせん ▶`;
    button.addEventListener("click", () => startQuiz(level, weakQueue(level), true));
    return button;
  }));
}

/* ---- 認定証の日付(例: 2026年7月4日) ---- */
function todayHtml() {
  const now = new Date();
  return `${now.getFullYear()}<ruby>年<rt>ねん</rt></ruby>${now.getMonth() + 1}<ruby>月<rt>がつ</rt></ruby>${now.getDate()}<ruby>日<rt>にち</rt></ruby>`;
}

/* ---- 紙吹雪(「動きを減らす」設定の端末では出さない) ---- */
function launchConfetti(count) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#70b957", "#ffd84d", "#8dd8ee", "#e96957", "#ffffff"];
  for (let index = 0; index < count; index += 1) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.setAttribute("aria-hidden", "true");
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.background = colors[index % colors.length];
    piece.style.animationDelay = `${Math.random() * 0.6}s`;
    piece.style.width = `${6 + Math.random() * 7}px`;
    piece.style.height = `${8 + Math.random() * 9}px`;
    if (index % 3 === 0) piece.style.borderRadius = "50%";
    piece.style.setProperty("--dx", `${(Math.random() * 2 - 1) * 140}px`);
    piece.style.setProperty("--spin", `${360 + Math.random() * 420}deg`);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

function saveProgress() {
  if (!state.level || state.reviewMode) return;
  const saved = {
    level: state.level, queue: state.queue, index: state.index,
    score: state.score, wrong: state.wrong
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  updateResumeButton();
}

function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || !levelInfo[saved.level] || saved.index >= saved.queue.length) return;
    state = { ...state, ...saved, reviewMode: false, locked: false };
    showScreen("quizScreen");
    renderQuestion();
  } catch {
    localStorage.removeItem(STORAGE_KEY);
  }
}

function updateResumeButton() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { /* 破損時は非表示 */ }
  $("resumeArea").hidden = !saved;
  if (saved && levelInfo[saved.level]) {
    $("resumeButton").innerHTML = `${kidHtml(levelInfo[saved.level].name)} <ruby>第<rt>だい</rt></ruby>${saved.index + 1}<ruby>問<rt>もん</rt></ruby>から`;
  }
}

function goHome() {
  showScreen("topScreen");
  updateResumeButton();
}

function confirmQuit() {
  if (window.confirm("ここまでの きろくを のこして、トップに もどりますか？")) goHome();
}

function playTone(frequency) {
  if (!state.sound || !window.AudioContext) return;
  const context = new AudioContext();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(0.05, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.12);
  oscillator.connect(gain).connect(context.destination);
  oscillator.start();
  oscillator.stop(context.currentTime + 0.12);
}

document.querySelectorAll(".level-card").forEach((button) => {
  button.addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    startQuiz(button.dataset.level);
  });
});
$("resumeButton").addEventListener("click", loadProgress);
$("quitButton").addEventListener("click", confirmQuit);
$("homeButton").addEventListener("click", goHome);
$("resultHomeButton").addEventListener("click", goHome);
$("retryButton").addEventListener("click", () => startQuiz(state.level));
$("reviewButton").addEventListener("click", () => startQuiz(state.level, [...new Set(state.wrong)], true));
function renderTeacherList() {
  const wrap = $("teacherList");
  wrap.replaceChildren();
  for (const [level, info] of Object.entries(levelInfo)) {
    const heading = document.createElement("h3");
    heading.textContent = `${info.name}（${info.label}）`;
    wrap.appendChild(heading);
    questions.filter((q) => q.level === level).forEach((q, i) => {
      const item = document.createElement("div");
      item.className = "teacher-item";
      const choices = q.choices.map((c, j) =>
        j === q.answer ? `<span class="correct-choice">★${escapeKidText(c)}</span>` : `・${escapeKidText(c)}`).join("　");
      item.innerHTML = `<strong>${i + 1}. ${escapeKidText(q.question)}</strong><br>${choices}<br><small>${escapeKidText(q.explanation)}（${escapeKidText(q.source)}）</small>`;
      wrap.appendChild(item);
    });
  }
}
$("dailyButton").addEventListener("click", startDailyChallenge);
$("badgeLinkButton").addEventListener("click", () => { renderBadges(); showScreen("badgeScreen"); });
$("badgeBackButton").addEventListener("click", () => showScreen("topScreen"));
const mascotLines = ["やっほー！", "きょうも たんけんびより！", "めむろの こと、どれだけ しってる？", "タッチ ありがとう！", "にがてノートも みてみてね", "5れんぞく めざそう！", "きょうの ちょうせん、やった？", "いっしょに はっけんしよう！"];
$("mascotButton").addEventListener("click", () => {
  const mascot = document.querySelector(".hero-mascot");
  mascot.classList.remove("is-bouncing");
  void mascot.offsetWidth;  // アニメを毎回リセットするおまじない
  mascot.classList.add("is-bouncing");
  const bubble = $("mascotBubble");
  const rare = Math.random() < 0.12;  // ときどきレア反応
  bubble.textContent = rare ? "✨ ラッキー！ きょうは いいこと ありそう ✨" : mascotLines[Math.floor(Math.random() * mascotLines.length)];
  bubble.hidden = false;
  if (rare) launchConfetti(16);
  playTone(rare ? 990 : 760);
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => { bubble.hidden = true; }, 2600);
});
/* 先生用リンクは、アドレスの最後に #sensei を付けたときだけ表示
   (例: https://～/memuro/#sensei )。児童の画面には出ません。 */
function updateTeacherLinkVisibility() {
  const byHash = location.hash.replace("#", "") === "sensei";
  const byQuery = new URLSearchParams(location.search).has("sensei");
  $("teacherLinkRow").hidden = !(byHash || byQuery);
}
window.addEventListener("hashchange", updateTeacherLinkVisibility);
updateTeacherLinkVisibility();
$("teacherLinkButton").addEventListener("click", () => { renderTeacherList(); showScreen("teacherScreen"); });
$("teacherBackButton").addEventListener("click", () => showScreen("topScreen"));

$("readButton").addEventListener("click", speakCurrent);
if (!speechSupported) $("readButton").hidden = true;
$("nextButton").addEventListener("click", () => {
  if ($("feedback").hidden) return;
  $("feedback").hidden = true;
  nextQuestion();
});
$("soundButton").addEventListener("click", () => {
  state.sound = !state.sound;
  $("soundButton").setAttribute("aria-pressed", String(state.sound));
  $("soundButton").setAttribute("aria-label", state.sound ? "こうかおんを きる" : "こうかおんを つける");
  $("soundButton").innerHTML = state.sound ? SVGI.note : SVGI.noteOff;
});

renderTopScreen();
applyKidText();

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 未対応環境でもアプリ本体は動く */ });
